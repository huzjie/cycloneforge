apiVersion: apps/v1
kind: Deployment
metadata:
  name: cycloneforge
  labels:
    app: cycloneforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cycloneforge
  template:
    metadata:
      labels:
        app: cycloneforge
    spec:
      containers:
        - name: api
          image: cycloneforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
